<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Engineering · Presenter</title>
<style>
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "JBM"; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
:root { --bg:#0b0c10; --panel:#14161c; --line:rgba(236,232,223,.12); --ink:#ece8df; --ink2:#b9b6ae; --dim:#7d828c; --amber:#f2b84b; --red:#ff6b5e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, sans-serif; overflow: hidden; }
.app { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 14px; height: 100%; padding: 14px; }
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 22px; font-family: JBM, monospace; font-size: 14px; color: var(--dim); }
header .clock { font-size: 30px; color: var(--ink); letter-spacing: .04em; }
header .clock.warn { color: var(--amber); }
header .pos { color: var(--amber); }
header .sp { flex: 1; }
.btn { font-family: JBM, monospace; font-size: 13px; color: var(--ink2); background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--amber); color: var(--ink); }
.btn.on { background: var(--amber); color: #000; }
.left { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.label { font-family: JBM, monospace; font-size: 12px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; display: flex; gap: 12px; }
.label b { color: var(--amber); font-weight: 400; }
.beats { display: flex; gap: 6px; margin-left: auto; }
.beats i { width: 18px; height: 6px; border-radius: 3px; background: var(--line); display: inline-block; }
.beats i.done { background: var(--amber); }
.right { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.below { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 6px; min-height: 0; }
.below .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.notes { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px 26px; }
.notes h2 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.notes .meta { font-family: JBM, monospace; font-size: 12px; color: var(--dim); margin-bottom: 18px; letter-spacing: .08em; }
.notes p { font-size: var(--nfs, 22px); line-height: 1.55; color: var(--ink); margin-bottom: 14px; }
.notes .screen { font-size: 14px; color: var(--dim); border-left: 2px solid var(--line); padding-left: 12px; margin-bottom: 18px; white-space: pre-wrap; }
.notes .clk { font-family: JBM, monospace; font-size: .62em; letter-spacing: .1em; color: #000; background: var(--amber); padding: 2px 6px; border-radius: 4px; vertical-align: 2px; }
.notes .cut { color: var(--dim); border-left: 2px dashed var(--amber); padding-left: 12px; }
.dc { display: flex; flex-wrap: wrap; gap: 8px; }
footer { grid-column: 1 / 3; display: flex; gap: 8px; align-items: center; }
.big { font-size: 15px; padding: 12px 22px; }
.hint { font-family: JBM, monospace; font-size: 12px; color: var(--dim); margin-left: auto; }
.offline { color: var(--red); }
/* vertical monitor: stack the panels (current slide on top, next + director's cut, notes below) */
@media (orientation: portrait) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
  header, footer { grid-column: 1; }
  .nowF { width: min(100%, calc(36vh * 16 / 9)); align-self: center; }
  .below { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin-top: 0; }
  .below .frame { width: min(100%, calc(17vh * 16 / 9)); }
  footer { flex-wrap: wrap; }
  footer .hint { flex-basis: 100%; margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="clock" id="clock">00:00</span>
    <button class="btn" id="timerBtn">START TIMER</button>
    <button class="btn" id="resetBtn">RESET</button>
    <span id="wall"></span>
    <span class="sp"></span>
    <span class="pos" id="pos">waiting for deck…</span>
  </header>
  <div class="left">
    <div class="label"><b>NOW</b><span id="curTitle"></span><span class="beats" id="beats"></span></div>
    <div class="frame nowF"><iframe id="curF" src="./?follow"></iframe></div>
    <div class="below">
      <div class="col">
        <div class="label"><b>NEXT</b><span id="nextTitle"></span></div>
        <div class="frame"><iframe id="nextF" src="./?follow&offset=1"></iframe></div>
      </div>
      <div class="col">
        <div class="label"><b>DIRECTOR'S CUT</b></div>
        <div class="dc" id="dc"></div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="notes" id="notes"></div>
  </div>
  <footer>
    <button class="btn" data-cmd="home">⏮ START</button>
    <button class="btn big" data-cmd="prev">◀ BACK</button>
    <button class="btn big" data-cmd="next">NEXT ▶</button>
    <button class="btn" id="skipBtn" data-cmd="skip">OPTIONAL: SHOWN</button>
    <button class="btn" data-cmd="black">BLACK SCREEN</button>
    <button class="btn" id="fsm">A−</button><button class="btn" id="fsp">A+</button>
    <span class="hint">→ / space next · ← back · 0 or ⌘← start · O optional · B black · D director's cut · Esc return</span>
  </footer>
</div>
<script>
const chan = new BroadcastChannel('m5-cut3-deck');
const send = (cmd, extra = {}) => chan.postMessage(Object.assign({ type: 'cmd', cmd }, extra));
let notes = {}, state = null;
fetch('data/notes.json', { cache: 'no-store' }).then(r => r.json()).then(n => { notes = n; render(); }).catch(() => {});

const esc = s => String(s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const clicks = h => h.replace(/\[click\]/g, '<span class="clk">▶ CLICK</span>');
function paras(t) { return clicks(esc(t)).split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => p.startsWith('✂') ? `<p class="cut">${p}</p>` : `<p>${p}</p>`).join(''); }
function render() {
  if (!state) return;
  const n = notes[state.id] || {};
  document.getElementById('pos').textContent = `${state.dc ? "DIRECTOR'S CUT · " : ''}${state.id} · ${state.index + 1} / ${state.total}`;
  document.getElementById('curTitle').textContent = n.title || state.id;
  document.getElementById('nextTitle').textContent = state.next ? `${state.next} · ${(notes[state.next] || {}).title || ''}` : 'END';
  document.getElementById('beats').innerHTML = Array.from({ length: state.steps }, (_, i) => `<i class="${i < state.beat ? 'done' : ''}"></i>`).join('');
  const nb = document.getElementById('notes');
  nb.innerHTML = `<h2>${esc(n.title || state.id)}</h2><div class="meta">${n.optional ? 'OPTIONAL · ' : ''}CLICKS ${state.beat}/${state.steps}</div>` +
    (n.screen ? `<div class="screen">${esc(n.screen)}</div>` : '') + (paras(n.say) || '<p style="color:var(--dim)">No notes for this scene.</p>');
  const sk = document.getElementById('skipBtn');
  sk.textContent = state.skip ? 'OPTIONAL: SKIPPED' : 'OPTIONAL: SHOWN'; sk.classList.toggle('on', state.skip);
  const dc = document.getElementById('dc');
  dc.innerHTML = (state.dc ? `<button class="btn on" data-close>◀ RETURN FROM DIRECTOR'S CUT</button>` : '') +
    ((state.dcAvail || []).map(d => `<button class="btn" data-dc="${d.id}">🎬 ${esc(d.title)}</button>`).join('') || (state.dc ? '' : '<span class="hint" style="margin:0">none for this scene</span>'));
  dc.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => send('dc', { id: b.dataset.dc }));
  dc.querySelectorAll('[data-close]').forEach(b => b.onclick = () => send('closedc'));
}
chan.onmessage = (ev) => {
  const m = ev.data || {};
  if (m.type === 'state') {
    const sceneChanged = !state || state.id !== m.id;
    state = m; render();
    if (sceneChanged) document.getElementById('notes').scrollTop = 0;
  }
};
send('hello');
setInterval(() => { if (!state) send('hello'); }, 1500);

document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send(b.dataset.cmd));
addEventListener('keydown', (e) => {
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); send('next'); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k) && !(e.metaKey || e.ctrlKey)) { e.preventDefault(); send('prev'); }
  else if (k === 'Home' || k === '0' || (k === 'ArrowLeft' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); send('home'); }
  else if (k === 'o' || k === 'O') send('skip');
  else if (k === 'b' || k === 'B' || k === '.') send('black');
  else if (k === 'Escape') send('closedc');
  else if ((k === 'd' || k === 'D') && state && state.dcAvail && state.dcAvail[0]) send('dc', { id: state.dcAvail[0].id });
});

// timer
let t0 = null, acc = 0;
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
document.getElementById('timerBtn').onclick = (e) => {
  if (t0) { acc += (Date.now() - t0) / 1000; t0 = null; e.target.textContent = 'RESUME'; }
  else { t0 = Date.now(); e.target.textContent = 'PAUSE'; }
};
document.getElementById('resetBtn').onclick = () => { t0 = t0 ? Date.now() : null; acc = 0; };
setInterval(() => {
  const s = acc + (t0 ? (Date.now() - t0) / 1000 : 0);
  const c = document.getElementById('clock'); c.textContent = fmt(s); c.classList.toggle('warn', s > 45 * 60);
  document.getElementById('wall').textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}, 500);

// notes font size
let nfs = 22;
document.getElementById('fsm').onclick = () => { nfs = Math.max(14, nfs - 2); document.documentElement.style.setProperty('--nfs', nfs + 'px'); };
document.getElementById('fsp').onclick = () => { nfs = Math.min(34, nfs + 2); document.documentElement.style.setProperty('--nfs', nfs + 'px'); };

</script>
</body>
</html>
